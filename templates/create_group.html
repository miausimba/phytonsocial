{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Crear Grupo</h2>
                    
                    <form action="{{ url_for('create_group') }}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre del Grupo</label>
                            <input type="text" class="form-control" id="name" name="name" required maxlength="100">
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Descripción</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                            <div class="form-text">Describe el propósito del grupo y sus reglas principales.</div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Crear Grupo
                            </button>
                            <a href="{{ url_for('groups') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="display-1 text-danger mb-4">500</h1>
                    <h2 class="mb-4">Error Interno del Servidor</h2>
                    <p class="lead mb-4">Lo sentimos, ha ocurrido un error en el servidor.</p>
                    <p class="mb-4">Nuestro equipo técnico ha sido notificado y está trabajando en solucionarlo.</p>
                    <div class="d-grid gap-2 col-6 mx-auto">
                        <a href="{{ url_for('index') }}" class="btn btn-primary">Volver al Inicio</a>
                        <button onclick="window.location.reload()" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-clockwise"></i> Intentar de nuevo
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
